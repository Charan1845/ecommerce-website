<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Decide the theme before anything paints, so there's no light-then-dark
    // flash. The toggle button itself lives in common.js.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>My orders - DevGear</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/">Dev<span>Gear</span></a>
      <nav id="nav"><a href="/">Shop</a></nav>
    </div>
  </header>

  <main class="wrap">
    <h1>My orders</h1>
    <p class="subtitle" id="sub"></p>

    <div id="notice" class="notice" hidden></div>

    <div id="empty" class="empty" hidden>
      <h2>No orders yet</h2>
      <p>When you place an order it will show up here. <a href="/">Start shopping</a>.</p>
    </div>

    <div id="orders"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <strong>Demo store - no real orders are fulfilled and no payment is taken.</strong>
      Built as a portfolio project.
    </div>
  </footer>

  <!-- Razorpay's own checkout window. Card details are typed into it and go
       straight to Razorpay - they never touch this page or our server. -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
