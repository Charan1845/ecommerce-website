<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="ZEB-A19HD 19-inch Monitor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="690" cy="110" r="150" fill="#e8112d" opacity="0.10"/>
  <ellipse cx="400" cy="530" rx="250" ry="26" fill="#0f172a" opacity="0.07"/>

  <g filter="url(#soft)">
    
    <rect x="170.5" y="131" width="459" height="258" rx="10" fill="#1f2937"/>
    <rect x="184.5" y="145" width="431" height="224"
          rx="4" fill="url(#screen)"/>
    <rect x="184.5" y="145" width="431" height="224"
          rx="4" fill="#e8112d" opacity="0.28"/>
    <rect x="170.5" y="367" width="459" height="22" rx="6" fill="#374151"/>
    
    <rect x="374" y="389" width="52" height="74" rx="8" fill="#374151"/>
    <rect x="282" y="455" width="236" height="22" rx="11" fill="#1f2937"/>
    
  </g>
</svg>
