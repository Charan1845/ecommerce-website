    <path d="M 254 300
             C 254 142, 546 142, 546 300"
          stroke="#1a1a1a" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9"/>
    <g>
      <rect x="198" y="286" width="104" height="150" rx="46" fill="#1f2937"/>
      <rect x="212" y="300" width="76" height="122" rx="36" fill="#374151"/>
      <circle cx="250" cy="362" r="19" fill="#1a1a1a" opacity="0.85"/>
    </g>
    <g>
      <rect x="498" y="286" width="104" height="150" rx="46" fill="#1f2937"/>
      <rect x="512" y="300" width="76" height="122" rx="36" fill="#374151"/>
      <circle cx="550" cy="362" r="19" fill="#1a1a1a" opacity="0.85"/>
    </g>
  </g>
</svg>
