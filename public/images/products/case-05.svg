<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="211 Air Micro Tower Cabinet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="690" cy="110" r="150" fill="#ff4d00" opacity="0.10"/>
  <ellipse cx="400" cy="530" rx="250" ry="26" fill="#0f172a" opacity="0.07"/>

  <g filter="url(#soft)">
    
    <rect x="250" y="100" width="300" height="400" rx="12" fill="#1f2937"/>
    <rect x="268" y="118" width="264" height="364" rx="8" fill="#0f172a" opacity="0.85"/>
    <rect x="268" y="118" width="264" height="364" rx="8"
          fill="none" stroke="#ff4d00" stroke-width="2" opacity="0.6"/>

    <rect x="290" y="144" width="190" height="168" rx="5" fill="#14532d" opacity="0.75"/>
    <rect x="302" y="320" width="180" height="42" rx="5" fill="#ff4d00" opacity="0.7"/>
    <rect x="284" y="404" width="232" height="58" rx="6" fill="#374151"/>

    <circle cx="508" cy="170" r="30" fill="#374151"/>
     <circle cx="508" cy="170" r="22" fill="none" stroke="#ff4d00" stroke-width="3" opacity="0.8"/><circle cx="508" cy="262" r="30" fill="#374151"/>
     <circle cx="508" cy="262" r="22" fill="none" stroke="#ff4d00" stroke-width="3" opacity="0.8"/>

    <rect x="270" y="500" width="46" height="14" rx="4" fill="#374151"/>
    <rect x="484" y="500" width="46" height="14" rx="4" fill="#374151"/>
