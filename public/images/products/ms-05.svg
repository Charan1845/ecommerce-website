<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Core Wired Optical Mouse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="690" cy="110" r="150" fill="#0ea5e9" opacity="0.10"/>
  <ellipse cx="400" cy="530" rx="250" ry="26" fill="#0f172a" opacity="0.07"/>

  <g filter="url(#soft)">
    <path d="M 400 160 C 400 110, 470 100, 470 60"
             stroke="#374151" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 400 160
             C 314.5 196, 305 295, 316.4 394
             C 335.4 466, 464.6 466, 483.6 394
             C 495 295, 485.5 196, 400 160 Z"
          fill="#1f2937"/>
    <path d="M 400 166 L 400 286" stroke="#4b5563" stroke-width="4"/>
    <path d="M 322.1 286 L 477.9 286"
          stroke="#4b5563" stroke-width="4" opacity="0.6"/>
    <rect x="389" y="202" width="22" height="52" rx="11" fill="#0ea5e9"/>
  </g>
</svg>
