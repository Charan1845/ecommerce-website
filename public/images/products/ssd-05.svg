<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="BarraCuda 2TB Hard Drive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="690" cy="110" r="150" fill="#6ebe4a" opacity="0.10"/>
  <ellipse cx="400" cy="530" rx="250" ry="26" fill="#0f172a" opacity="0.07"/>

  <g filter="url(#soft)">
    
    <rect x="185" y="145" width="430" height="310" rx="10" fill="url(#metal)"/>
    <rect x="203" y="163" width="394" height="274" rx="6" fill="#374151"/>
    <circle cx="400" cy="300" r="115" fill="#0f172a"/>
       <circle cx="400" cy="300" r="26" fill="url(#metal)"/>
       <path d="M 555 197 q -70 70 -120 110" stroke="#6ebe4a" stroke-width="12"
             fill="none" stroke-linecap="round"/>
    <circle cx="201" cy="161" r="6" fill="#1f2937"/><circle cx="599" cy="161" r="6" fill="#1f2937"/><circle cx="201" cy="439" r="6" fill="#1f2937"/><circle cx="599" cy="439" r="6" fill="#1f2937"/>
  </g>
</svg>
