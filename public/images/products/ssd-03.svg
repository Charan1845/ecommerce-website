      <rect x="140" y="235" width="520" height="130" rx="8" fill="#14532d"/>
      <rect x="210" y="251" width="420" height="98" rx="5" fill="#0072ce" opacity="0.9"/>
      <rect x="236" y="269" width="76" height="62" rx="4" fill="#1f2937" opacity="0.55"/><rect x="336" y="269" width="76" height="62" rx="4" fill="#1f2937" opacity="0.55"/><rect x="436" y="269" width="76" height="62" rx="4" fill="#1f2937" opacity="0.55"/><rect x="536" y="269" width="76" height="62" rx="4" fill="#1f2937" opacity="0.55"/>
      <rect x="140" y="269" width="46" height="26" rx="2" fill="#d4a017"/>
      <rect x="140" y="305" width="46" height="26" rx="2" fill="#d4a017"/>
